name: Grow git-bonsai

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/bonsai.yml
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: egorthinks/git-bonsai@v1
        with:
          user: munaabujaber
          commit: 'false'
      - name: Crop transparent GIF border
        run: |
          python -m pip install Pillow
          python scripts/crop_bonsai.py output/bonsai-growth.gif output/bonsai-growth-cropped.gif
      - name: Publish bonsai images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/bonsai.svg output/bonsai.png output/bonsai.gif output/bonsai-growth.gif output/bonsai-growth-cropped.gif
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: tend the bonsai 🌳"
          git push origin HEAD:main
